<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">RabbitMQ Resilient Dead-Letter &amp; Exponential Backoff Delay Topology</text>
  <rect x="850" y="40" width="85" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="864" y="58" fill="#047857" font-size="11" font-weight="600">PRODUCTION</text>
  <rect x="945" y="40" width="95" height="26" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <text x="955" y="58" fill="#c2410c" font-size="11" font-weight="600">RABBITMQ 3.12+</text>
  <rect x="1050" y="40" width="95" height="26" rx="13" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="1062" y="58" fill="#b91c1c" font-size="11" font-weight="600">DLX TOPOLOGY</text>

  <!-- COLUMN 1: Task Producers -->
  <rect x="40" y="110" width="250" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="250" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. TASK PRODUCERS</text>

  <rect x="60" y="170" width="210" height="90" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="75" y="198" fill="#0369a1" font-size="13" font-weight="600">Task Ingestion Client</text>
  <text x="75" y="222" fill="#0c4a6e" font-size="11">deliveryMode: 2 (Persistent)</text>
  <text x="75" y="242" fill="#0284c7" font-size="10">Durable storage on broker disk</text>

  <rect x="60" y="280" width="210" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="308" fill="#0f172a" font-size="13" font-weight="600">Primary Exchange</text>
  <text x="75" y="332" fill="#64748b" font-size="11">Type: direct ('tasks.direct')</text>
  <text x="75" y="350" fill="#64748b" font-size="10">Routing Key: task.execute</text>

  <rect x="60" y="385" width="210" height="95" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="413" fill="#0f172a" font-size="13" font-weight="600">Message Headers</text>
  <text x="75" y="437" fill="#64748b" font-size="11">x-retry-count: 0</text>
  <text x="75" y="457" fill="#64748b" font-size="11">correlationId &amp; timestamp</text>

  <rect x="60" y="500" width="210" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="528" fill="#0f172a" font-size="13" font-weight="600">Channel Management</text>
  <text x="75" y="552" fill="#64748b" font-size="11">Auto-reconnection backoff</text>

  <!-- COLUMN 2: Primary Worker Pool -->
  <rect x="320" y="110" width="260" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="320" y="110" width="260" height="40" rx="8" fill="#f1f5f9"/>
  <text x="340" y="136" fill="#16a34a" font-size="13" font-weight="700">2. PRIMARY WORKER POOL</text>

  <rect x="340" y="170" width="220" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="355" y="198" fill="#15803d" font-size="13" font-weight="700">Primary Work Queue</text>
  <text x="355" y="222" fill="#166534" font-size="11">'tasks.primary' (Durable)</text>
  <text x="355" y="242" fill="#14532d" font-size="10">x-dead-letter-exchange: tasks.dlx</text>
  <text x="355" y="260" fill="#15803d" font-size="10">Backpressure bound</text>

  <rect x="340" y="300" width="220" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="355" y="328" fill="#0f172a" font-size="13" font-weight="600">QoS &amp; Prefetch Control</text>
  <text x="355" y="352" fill="#64748b" font-size="11">channel.prefetch(10)</text>
  <text x="355" y="370" fill="#64748b" font-size="10">Fair workload distribution across pods</text>

  <rect x="340" y="410" width="220" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="355" y="438" fill="#0f172a" font-size="13" font-weight="600">Manual Acknowledgments</text>
  <text x="355" y="462" fill="#64748b" font-size="11">Success: channel.ack(msg)</text>
  <text x="355" y="480" fill="#64748b" font-size="10">Failure: compute retry route</text>

  <rect x="340" y="515" width="220" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="355" y="540" fill="#0f172a" font-size="12" font-weight="600">Graceful Drain &amp; Stop</text>
  <text x="355" y="558" fill="#64748b" font-size="10">Completes in-flight task before exit</text>

  <!-- COLUMN 3: Tiered Retry Delay Engine -->
  <rect x="610" y="110" width="280" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="610" y="110" width="280" height="40" rx="8" fill="#f1f5f9"/>
  <text x="630" y="136" fill="#d97706" font-size="13" font-weight="700">3. TIERED RETRY DELAY ENGINE</text>

  <rect x="630" y="170" width="240" height="75" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="645" y="198" fill="#b45309" font-size="13" font-weight="600">Retry Exchange</text>
  <text x="645" y="222" fill="#78350f" font-size="11">Type: direct ('tasks.retry.exchange')</text>
  <text x="645" y="238" fill="#92400e" font-size="10">Decoupled delayed routing pipeline</text>

  <rect x="630" y="260" width="240" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
  <text x="645" y="285" fill="#0f172a" font-size="12" font-weight="600">Delay Queue 1: 'tasks.retry.10s'</text>
  <text x="645" y="305" fill="#64748b" font-size="10">TTL = 10,000ms | Retry #1</text>

  <rect x="630" y="335" width="240" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
  <text x="645" y="360" fill="#0f172a" font-size="12" font-weight="600">Delay Queue 2: 'tasks.retry.60s'</text>
  <text x="645" y="380" fill="#64748b" font-size="10">TTL = 60,000ms | Retry #2</text>

  <rect x="630" y="410" width="240" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1"/>
  <text x="645" y="435" fill="#0f172a" font-size="12" font-weight="600">Delay Queue 3: 'tasks.retry.300s'</text>
  <text x="645" y="455" fill="#64748b" font-size="10">TTL = 300,000ms | Retry #3</text>

  <rect x="630" y="485" width="240" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="645" y="513" fill="#0f172a" font-size="13" font-weight="600">Automatic TTL Reprovision</text>
  <text x="645" y="537" fill="#64748b" font-size="11">Upon TTL expiry, AMQP routes to DLX</text>
  <text x="645" y="557" fill="#64748b" font-size="10">DLX automatically routes back to primary</text>

  <!-- COLUMN 4: Quarantine DLQ & Telemetry -->
  <rect x="920" y="110" width="240" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="920" y="110" width="240" height="40" rx="8" fill="#f1f5f9"/>
  <text x="940" y="136" fill="#dc2626" font-size="13" font-weight="700">4. QUARANTINE &amp; DLQ</text>

  <rect x="940" y="170" width="200" height="110" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="955" y="198" fill="#991b1b" font-size="13" font-weight="700">Terminal Dead Letter</text>
  <text x="955" y="222" fill="#b91c1c" font-size="11">Queue: 'tasks.dlq' (Fanout)</text>
  <text x="955" y="242" fill="#7f1d1d" font-size="10">Trigger: retries &gt;= 3</text>
  <text x="955" y="260" fill="#7f1d1d" font-size="10">Quarantine for manual audit</text>

  <rect x="940" y="300" width="200" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="955" y="328" fill="#0f172a" font-size="13" font-weight="600">Full Jitter Backoff</text>
  <text x="955" y="352" fill="#64748b" font-size="11">Prevents Thundering Herd</text>
  <text x="955" y="370" fill="#64748b" font-size="10">Randomized collision mitigation</text>

  <rect x="940" y="405" width="200" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="955" y="433" fill="#0f172a" font-size="13" font-weight="600">x-death Inspection</text>
  <text x="955" y="457" fill="#64748b" font-size="11">Full death cause tracking</text>
  <text x="955" y="475" fill="#64748b" font-size="10">Stack trace &amp; error metadata</text>

  <rect x="940" y="510" width="200" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="955" y="535" fill="#0f172a" font-size="12" font-weight="600">Prometheus Metrics</text>
  <text x="955" y="555" fill="#64748b" font-size="10">Queue depth &amp; consumer rate</text>
</svg>
